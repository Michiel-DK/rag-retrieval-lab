[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragexp"
version = "0.1.0"
description = "Retrieval methods run on NFCorpus with predictions written down first: data loader, metrics, retrievers, rerankers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michiel De Koninck" }]
requires-python = ">=3.12"  # the only version CI and the local venv run
dependencies = [
    "datasets>=2.14",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "torch<2.15",  # 2.15.0 aborts on Apple-GPU (MPS) encode on macOS 14; 2.14.1 passes the gate
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
]

[project.scripts]
ragexp = "ragexp.cli:main"

[project.optional-dependencies]
gliclass = ["gliclass>=0.1.21"]        # notebook 04 GLiClass arm; tests/test_rerank.py imports it
notebooks = ["jupyter>=1.0", "matplotlib>=3.8", "xgboost>=2.0"]  # xgboost: notebook 06 only
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ragexp"]
