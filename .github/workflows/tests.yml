name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # integration tests download NFCorpus and re-embed it; run them locally
      - run: python -m pytest -q tests --ignore=tests/test_integration.py   # -m puts the repo root on sys.path (ragexp is not packaged)
